version: '3.9'

services:
  db-init:
    image: postgres:17-bookworm
    volumes:
      - ./blockscout-db-data:/var/lib/postgresql/data
    entrypoint:
      - sh
      - -c
      - |
        chown -R 2000:2000 /var/lib/postgresql/data

  db:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    user: 2000:2000
    shm_size: 256m
    restart: always
    container_name: 'db'
    command: ["postgres", "-c", "max_connections=300", "-c", "client_connection_check_interval=60000", "-c", "shared_buffers=6GB", "-c", "effective_cache_size=12GB", "-c", "work_mem=128MB", "-c", "ssl=on", "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "ssl_cert_file=/run/db-tls/current/fullchain.pem", "-c", "ssl_key_file=/run/db-tls/current/privkey.pem", "-c", "hba_file=/run/db-access/pg_hba.conf"]
    environment:
        POSTGRES_DB: 'blockscout'
        POSTGRES_USER: 'blockscout'
        POSTGRES_PASSWORD: '${BLOCKSCOUT_DB_PASSWORD}'
    ports:
      - target: 5432
        published: 7432
    volumes:
      - /etc/db-access/tls/blockscout-db:/run/db-tls:ro
      - /etc/db-access/postgres/blockscout/db:/run/db-access:ro
      - ./blockscout-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      com.atleta.role: "blockscout"
      com.atleta.service: "db"
