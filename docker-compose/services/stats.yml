version: '3.9'

services:
  stats-db-init:
    image: postgres:17-bookworm
    volumes:
      - ./stats-db-data:/var/lib/postgresql/data
    entrypoint:
      - sh
      - -c
      - |
        chown -R 2000:2000 /var/lib/postgresql/data

  stats-db:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    user: 2000:2000
    shm_size: 256m
    restart: always
    container_name: 'stats-db'
    command: ["postgres", "-c", "max_connections=200", "-c", "ssl=on", "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "ssl_cert_file=/run/db-tls/current/fullchain.pem", "-c", "ssl_key_file=/run/db-tls/current/privkey.pem", "-c", "hba_file=/run/db-access/pg_hba.conf"]
    environment:
        POSTGRES_DB: 'stats'
        POSTGRES_USER: 'stats'
        POSTGRES_PASSWORD: '${BLOCKSCOUT_STATS_DB_PASSWORD}'
    ports:
      - target: 5432
        published: 7433
    volumes:
      - /etc/db-access/tls/blockscout-db:/run/db-tls:ro
      - /etc/db-access/postgres/blockscout/stats-db:/run/db-access:ro
      - ./stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      com.atleta.role: "blockscout"
      com.atleta.service: "stats-db"

  stats:
    image: ghcr.io/blockscout/stats:${STATS_DOCKER_TAG:-v2.12.0}
    pull_policy: always
    platform: linux/amd64
    restart: always
    container_name: 'stats'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      -  ../envs/common-stats.env
    environment:
      - STATS__DB_URL=${STATS__DB_URL:?Required database connection URL}
      - STATS__BLOCKSCOUT_DB_URL=${STATS__BLOCKSCOUT_DB_URL:?Required database connection URL}
      - STATS__CREATE_DATABASE=${STATS__CREATE_DATABASE:-true}
      - STATS__RUN_MIGRATIONS=${STATS__RUN_MIGRATIONS:-true}
    labels:
      com.atleta.role: "blockscout"
      com.atleta.service: "stats"
