name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - mainnet
          - testnet_v2
      service_tag:
        description: Image tag to deploy (commit SHA from Build Images workflow)
        required: true
        type: string
      git_ref:
        description: Git ref for deployment templates
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: blockscout-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.service_tag }}" ]; then
            echo "service_tag is required" >&2
            exit 1
          fi

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v envsubst >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi

      - name: Set up SSH
        shell: bash
        env:
          HOST_1: ${{ secrets.HOST_1 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H "${HOST_1}" >> ~/.ssh/known_hosts
          printf "%s\n" "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Render compose bundle
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_REPO: ${{ secrets.CI_REGISTRY_REPO }}
          SERVICE_TAG: ${{ inputs.service_tag }}
          BACKEND_VERSION: ${{ vars.BACKEND_VERSION }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
          IS_TESTNET: ${{ vars.IS_TESTNET }}
          NETWORK_NAME: ${{ vars.NETWORK_NAME }}
          NETWORK_SHORT_NAME: ${{ vars.NETWORK_SHORT_NAME }}
          NETWORK_CHAIN_ID: ${{ vars.NETWORK_CHAIN_ID }}
          NETWORK_CURRENCY_NAME: ${{ vars.NETWORK_CURRENCY_NAME }}
          NETWORK_CURRENCY_SYMBOL: ${{ vars.NETWORK_CURRENCY_SYMBOL }}
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
          PRIV_RPC_NAME: ${{ vars.PRIV_RPC_NAME }}
          PUB_RPC_NAME: ${{ vars.PUB_RPC_NAME }}
          WALLETCONNECT: ${{ secrets.WALLETCONNECT }}
          BLOCKSCOUT_DB_PASSWORD: ${{ secrets.BLOCKSCOUT_DB_PASSWORD }}
          BLOCKSCOUT_STATS_DB_PASSWORD: ${{ secrets.BLOCKSCOUT_STATS_DB_PASSWORD }}
          BLOCKSCOUT_SECRET_KEY_BASE: ${{ secrets.BLOCKSCOUT_SECRET_KEY_BASE }}
          BLOCKSCOUT_RELEASE_COOKIE: ${{ secrets.BLOCKSCOUT_RELEASE_COOKIE }}
        run: |
          .github/scripts/render-compose.sh

      - name: Upload files to isolated per-run staging
        shell: bash
        env:
          HOST_1: ${{ secrets.HOST_1 }}
          HOST_1_USERNAME: ${{ secrets.HOST_1_USERNAME }}
          BASE_PATH: ${{ secrets.BASE_PATH }}
        run: bash .github/scripts/upload-deployment.sh

      - name: Deploy staged bundle under the shared lock
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_REPO: ${{ secrets.CI_REGISTRY_REPO }}
          SERVICE_TAG: ${{ inputs.service_tag }}
          BASE_PATH: ${{ secrets.BASE_PATH }}
          HOST_1: ${{ secrets.HOST_1 }}
          HOST_1_USERNAME: ${{ secrets.HOST_1_USERNAME }}
        run: |
          set -Eeuo pipefail
          target="${HOST_1_USERNAME}@${HOST_1}"
          remote_env=(
            "CI_REGISTRY=$(printf '%q' "${CI_REGISTRY}")"
            "CI_REGISTRY_REPO=$(printf '%q' "${CI_REGISTRY_REPO}")"
            "SERVICE_TAG=$(printf '%q' "${SERVICE_TAG}")"
            "BASE_PATH=$(printf '%q' "${BASE_PATH}")"
            "DEPLOY_ID=$(printf '%q' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          )
          ssh -o BatchMode=yes "${target}" "${remote_env[*]} bash -se" <<'REMOTE'
          set -Eeuo pipefail
          case "${BASE_PATH}" in /*) ;; *) exit 1 ;; esac
          [[ "${DEPLOY_ID}" =~ ^[0-9]+-[0-9]+$ ]] || exit 1
          BASE_PATH=$(cd -- "${BASE_PATH}" && pwd -P)
          stage="${BASE_PATH}/.incoming/${DEPLOY_ID}"
          test -f "${stage}/.github/scripts/deploy-remote.sh"
          bash "${stage}/.github/scripts/deploy-remote.sh"
          REMOTE

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Blockscout deploy"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Template ref: \`${{ inputs.git_ref }}\`"
            echo "- Service tag: \`${{ inputs.service_tag }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
